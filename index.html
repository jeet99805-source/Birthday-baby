<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bhavika ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --accent: #ff6b81;
            --text-main: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #ffe1e8 0%, #e0eafc 100%);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
        }

        /* SaaS Glassmorphism UI */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255,255,255,0.5);
        }

        .scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; z-index: 10;
        }
        .active { pointer-events: auto; }

        h1 { font-family: 'Playfair Display', serif; font-size: 5rem; color: var(--accent); margin: 0; text-align: center; line-height: 1.1; text-shadow: 0 10px 20px rgba(255, 107, 129, 0.2); }
        h2 { font-size: 2.2rem; font-weight: 800; color: var(--text-main); margin-bottom: 10px; }
        
        /* Premium Button */
        .btn-primary {
            padding: 18px 45px; font-size: 1.2rem; font-weight: 600; font-family: inherit;
            color: white; background: var(--accent); border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 25px rgba(255, 107, 129, 0.3); pointer-events: auto; z-index: 50;
        }
        .btn-primary:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 20px 35px rgba(255, 107, 129, 0.4); }

        /* Stage Layout for Dudu & Bubu */
        .stage {
            display: flex; gap: 40px; position: absolute; bottom: 12%; align-items: flex-end; justify-content: center;
            width: 100%;
        }

        /* The Custom GIF Containers */
        .character-wrapper {
            width: 180px; height: 180px;
            background-size: contain; background-repeat: no-repeat; background-position: center bottom;
            filter: drop-shadow(0 25px 20px rgba(0,0,0,0.15));
            transform-origin: bottom center;
        }

        /* High-Fidelity Cake & Candle */
        .cake-wrapper { position: relative; cursor: pointer; transform-style: preserve-3d; margin-bottom: 20px; }
        .cake-asset { font-size: 9rem; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15)); }
        
        .candle-stick {
            position: absolute; top: -70px; left: 50%; transform: translateX(-50%);
            font-family: 'Playfair Display', serif; font-size: 4.5rem; font-weight: 700; color: #ff4757;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.15);
        }

        .flame {
            width: 22px; height: 38px;
            background: linear-gradient(to bottom, #fff 0%, #ffeb3b 40%, #ff9800 100%);
            border-radius: 50% 50% 20% 20%;
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 0 40px #ffeb3b, 0 0 80px #ff9800;
            animation: burn 0.12s infinite alternate; transition: all 0.4s ease;
        }
        @keyframes burn {
            0% { transform: translateX(-50%) scale(0.95) skewX(-2deg); }
            100% { transform: translateX(-50%) scale(1.05) skewX(2deg); }
        }

        /* Final Message UI */
        .message-box {
            padding: 55px; text-align: center; max-width: 650px; line-height: 1.8; font-size: 1.2rem;
            transform: translateY(40px); opacity: 0;
        }
        .message-box span.highlight { color: var(--accent); font-weight: 800; font-size: 1.3rem; }
        
        /* Particle Canvas */
        #particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>

    <audio id="sfx-whoosh" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_787122144b.mp3" preload="auto"></audio>
    <audio id="sfx-cheer" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_d2cb1e3bd6.mp3" preload="auto"></audio>
    
    <audio id="sfx-voiceover" src="voice.mp3" preload="auto"></audio> 
    <audio id="bgm-song" src="song.mp3" preload="auto" loop></audio> 

    <canvas id="particles"></canvas>

    <div class="scene active" style="opacity: 1;" id="intro">
        <button class="btn-primary" id="init-btn">Begin the Magic ✨</button>
    </div>

    <div class="scene" id="scene-title">
        <h1>Happy Birthday<br>Jeevika</h1>
    </div>

    <div class="scene" id="scene-interaction">
        <div class="glass-panel" style="padding: 20px 40px; margin-bottom: 20vh; text-align: center;">
            <h2 style="margin: 0;">Make a Wish, Bubu ✨</h2>
            <p style="opacity: 0.7; font-size: 1rem; margin: 5px 0 0 0;">(Blow softly into your microphone or tap the cake)</p>
        </div>
        
        <div class="stage">
            <div class="character-wrapper char-idle" style="background-image: url('bubu.gif');"></div>
            
            <div class="cake-wrapper" id="target-cake">
                <div class="flame" id="flame-element"></div>
                <div class="candle-stick">19</div>
                <div class="cake-asset">🎂</div>
            </div>

            <div class="character-wrapper char-idle" style="background-image: url('dudu.gif');"></div>
        </div>
    </div>

    <div class="scene" id="scene-finale">
        <div class="glass-panel message-box" id="final-card">
            <h2>Happy 19th Birthday 💖</h2>
            <p>My sweetest <span class="highlight">Bubu Raani</span>,<br>
            Every day since <strong>March 16, 2021</strong> has been pure magic. <br>
            You make my world brighter, happier, and infinitely better.</p>
            <p style="font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--accent); margin-top: 30px; font-weight: 700;">
                Enjoy your day, Queen.<br>I love you ✨
            </p>
        </div>
        <div class="stage" id="finale-stage">
            <div class="character-wrapper char-cheer" style="background-image: url('bubu.gif');"></div>
            <div class="character-wrapper char-cheer" style="background-image: url('dudu.gif');"></div>
        </div>
    </div>

    <script>
        const initBtn = document.getElementById('init-btn');
        let audioCtx, analyser, micStream;
        let candleBlown = false;

        const sndWhoosh = document.getElementById('sfx-whoosh');
        const sndCheer = document.getElementById('sfx-cheer');
        const sndVoice = document.getElementById('sfx-voiceover');
        const sndSong = document.getElementById('bgm-song');

        // Cinematic SaaS "Breathing" for Dudu & Bubu
        gsap.to(".char-idle", {
            y: -15, rotation: () => Math.random() * 3 - 1.5, 
            yoyo: true, repeat: -1, stagger: 0.25, 
            duration: 1.8, ease: "sine.inOut"
        });

        initBtn.addEventListener('click', async () => {
            gsap.to(initBtn, {opacity: 0, scale: 0.8, duration: 0.4, ease: "back.in(1.2)", onComplete: () => initBtn.style.display = 'none'});
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                micStream = audioCtx.createMediaStreamSource(stream);
                micStream.connect(analyser);
                analyser.fftSize = 256;
            } catch (err) {
                console.warn("Mic access denied. Tap fallback active.");
            }
            runDirectorSequence();
        });

        function runDirectorSequence() {
            const tl = gsap.timeline();
            tl.to("#intro", {opacity: 0, duration: 0.5})
              .to("#scene-title", {opacity: 1, duration: 2.5, ease: "power3.out"})
              .to("#scene-title", {opacity: 0, duration: 1.5, delay: 2, filter: "blur(15px)"})
              .to("#scene-interaction", {opacity: 1, duration: 1.5, filter: "blur(0px)", ease: "power2.out", onComplete: activateMicEngine});
        }

        function activateMicEngine() {
            if (!audioCtx || candleBlown) return;
            const dataArr = new Uint8Array(analyser.frequencyBinCount);
            
            function monitorVolume() {
                if (candleBlown) return;
                analyser.getByteFrequencyData(dataArr);
                let sum = dataArr.reduce((a, b) => a + b, 0);
                let avg = sum / dataArr.length;

                if (avg > 75) { executeBlowOut(); } 
                else { requestAnimationFrame(monitorVolume); }
            }
            monitorVolume();
        }

        document.getElementById('target-cake').addEventListener('click', () => {
            if (!candleBlown) executeBlowOut();
        });

        function executeBlowOut() {
            candleBlown = true;
            
            // Audio Sequence
            sndWhoosh.volume = 0.6; sndWhoosh.play();
            setTimeout(() => { 
                sndCheer.volume = 0.3; sndCheer.play(); 
                sndSong.volume = 0.25; sndSong.play().catch(() => {});
            }, 600);

            // Extinguish Flame
            gsap.to("#flame-element", {opacity: 0, scale: 0, y: -40, duration: 0.3, ease: "power4.out"});
            
            // Grand Confetti
            var duration = 5000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 70, origin: { x: 0 }, colors: ['#ff6b81', '#ffffff', '#ffdab9'] });
                confetti({ particleCount: 7, angle: 120, spread: 70, origin: { x: 1 }, colors: ['#ff6b81', '#ffffff', '#ffdab9'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            // Transition & Final Animation
            const tl = gsap.timeline();
            tl.to("#scene-interaction", {opacity: 0, y: -40, duration: 1.2, delay: 1.8, ease: "power2.inOut"})
              .to("#scene-finale", {opacity: 1, duration: 1.2})
              .to("#final-card", {y: 0, opacity: 1, duration: 1.5, ease: "back.out(1.2)"}, "-=0.8")
              .call(() => {
                  sndVoice.play().catch(() => {}); 
                  
                  // Dudu & Bubu Celebration Squash & Stretch Jump
                  gsap.to(".char-cheer", {
                      y: -50, scaleY: 1.08, scaleX: 0.95, 
                      rotation: () => Math.random() * 12 - 6, 
                      yoyo: true, repeat: -1, stagger: 0.15, 
                      duration: 0.35, ease: "power2.inOut"
                  });
              });
        }

        // Ambient Particle Canvas Engine
        const cvs = document.getElementById('particles');
        const ctx = cvs.getContext('2d');
        function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        
        let pArr = Array.from({length: 75}, () => ({
            x: Math.random() * cvs.width, y: Math.random() * cvs.height,
            s: Math.random() * 2 + 1, dY: Math.random() * -1.5 - 0.5, op: Math.random()
        }));
        
        function drawP() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            pArr.forEach(p => {
                p.y += p.dY; if (p.y < 0) { p.y = cvs.height; p.x = Math.random() * cvs.width; }
                ctx.fillStyle = `rgba(255, 255, 255, ${p.op * 0.8})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(drawP);
        }
        drawP();
    </script>
</body>
</html>
