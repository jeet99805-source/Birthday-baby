<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bhavika 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CORE DESIGN SYSTEM & RESET
           ========================================================================== */
        :root {
            --bg-gradient-1: #ffe6ea;
            --bg-gradient-2: #fcf0f2;
            --bg-gradient-3: #fce4ec;
            --text-primary: #5c3a41;
            --gold: #ffdf00;
            --envelope-back: #f48fb1;
            --envelope-front: #fbcfe0;
            --envelope-flap: #f8bbd0;
            --paper: #fffcf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-3), var(--bg-gradient-2));
            background-size: 400% 400%;
            animation: breatheBG 15s ease infinite;
            color: var(--text-primary);
        }

        @keyframes breatheBG { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* ==========================================================================
           2. SCENE MANAGEMENT (THE STAGE)
           ========================================================================== */
        #stage { position: relative; width: 100%; height: 100%; z-index: 10; display: flex; justify-content: center; align-items: center; }
        
        .scene {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transform: scale(0.95);
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scene.active { opacity: 1; pointer-events: all; transform: scale(1); }

        /* ==========================================================================
           3. UI COMPONENTS
           ========================================================================== */
        .glass-btn {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 18px 50px; border-radius: 50px;
            font-size: 1.5rem; font-family: 'Quicksand', sans-serif; font-weight: 700; color: #d16b80;
            cursor: pointer; box-shadow: 0 8px 32px rgba(209, 107, 128, 0.2);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.5); transform: translateY(-5px); box-shadow: 0 12px 40px rgba(209, 107, 128, 0.4); }
        .glass-btn:active { transform: translateY(2px); }

        .title { font-family: 'Dancing Script', cursive; font-size: 5rem; color: #d16b80; text-shadow: 0 4px 15px rgba(255,255,255,0.8); text-align: center; line-height: 1.2; margin-bottom: 40px; }

        /* ==========================================================================
           4. CAKE & CANDLE (SCENE 2)
           ========================================================================== */
        .cake { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: 80px;}
        .tier { border-radius: 15px 15px 5px 5px; box-shadow: inset 0 -10px 20px rgba(0,0,0,0.05), 0 10px 15px rgba(0,0,0,0.1); }
        .tier-1 { width: 140px; height: 70px; background: #fff; z-index: 3; border-bottom: 6px solid #f8bbd0; }
        .tier-2 { width: 220px; height: 80px; background: #ffe4e1; z-index: 2; border-bottom: 6px solid #f48fb1; margin-top: -5px;}
        .tier-3 { width: 300px; height: 90px; background: #fffcf8; z-index: 1; border-bottom: 6px solid #f06292; margin-top: -5px;}

        .candles { position: absolute; top: -90px; display: flex; gap: 25px; z-index: 10; cursor: pointer; padding: 20px; transition: transform 0.3s; }
        .candles:hover { transform: scale(1.05); }
        .candle { width: 26px; height: 75px; background: repeating-linear-gradient(45deg, #fff, #fff 8px, #f48fb1 8px, #f48fb1 16px); border-radius: 6px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); position: relative; display: flex; justify-content: center; }
        .number { position: absolute; top: 15px; font-size: 2rem; font-weight: 900; color: #d16b80; text-shadow: 2px 2px 0 #fff; z-index: 2;}
        .flame { position: absolute; top: -35px; width: 22px; height: 38px; background: var(--gold); border-radius: 50% 50% 20% 20%; box-shadow: 0 0 20px 10px rgba(255, 223, 0, 0.6), 0 0 40px 15px rgba(255, 100, 0, 0.4); animation: flicker 0.4s infinite alternate; transform-origin: bottom center; transition: all 0.5s ease; }
        
        @keyframes flicker { 0% { transform: scale(1) rotate(-2deg); background: #ffdf00; } 100% { transform: scale(1.1) rotate(2deg); background: #ffc100; } }
        .flame.out { opacity: 0; transform: scale(0) translateY(20px); animation: none; }
        .hint { margin-top: 40px; font-size: 1.4rem; font-weight: bold; color: #d16b80; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* ==========================================================================
           5. PLUSHIES (SCENE 3)
           ========================================================================== */
        .plush-group { display: flex; gap: 50px; align-items: flex-end; }
        .plush { width: 160px; height: 160px; filter: drop-shadow(0 20px 20px rgba(0,0,0,0.15)); transform-origin: bottom center; opacity: 0; transform: translateY(100px); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .plush.show { opacity: 1; transform: translateY(0); animation: bounceIdle 2s infinite alternate ease-in-out 0.8s; }
        .plush.center { width: 200px; height: 200px; transition-delay: 0.2s; }
        @keyframes bounceIdle { 0% { transform: scaleY(1) translateY(0); } 100% { transform: scaleY(0.95) translateY(-15px); } }

        /* ==========================================================================
           6. THE ENVELOPE & LETTER (SCENE 4) - COMPLETELY REBUILT FOR RELIABILITY
           ========================================================================== */
        .mail-wrapper {
            position: relative; width: 400px; height: 260px;
            perspective: 1500px;
            /* Start hidden and slightly down */
            opacity: 0; transform: translateY(50px) scale(0.9);
            transition: all 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .mail-wrapper.enter { opacity: 1; transform: translateY(0) scale(1); }

        .env-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--envelope-back); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); z-index: 1; }
        
        .env-front { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: var(--envelope-front); clip-path: polygon(0 100%, 50% 40%, 100% 100%, 100% 100%, 0 100%); z-index: 4; border-radius: 0 0 12px 12px; }
        .env-front-left { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: #f8cdda; clip-path: polygon(0 0, 50% 50%, 0 100%); z-index: 3; border-radius: 12px 0 0 12px; }
        .env-front-right { position: absolute; bottom: 0; right: 0; width: 100%; height: 100%; background: #f8cdda; clip-path: polygon(100% 0, 50% 50%, 100% 100%); z-index: 3; border-radius: 0 12px 12px 0; }

        .env-flap { position: absolute; top: 0; left: 0; width: 100%; height: 160px; background: var(--envelope-flap); clip-path: polygon(0 0, 50% 100%, 100% 0); transform-origin: top; transition: transform 0.8s ease; z-index: 5; border-radius: 12px 12px 0 0; }

        /* The Paper: Sits inside the envelope originally */
        .paper {
            position: absolute; top: 15px; left: 5%; width: 90%; height: 230px;
            background: var(--paper); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 2; /* Between back and front */
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px;
            /* Animation properties */
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1), height 1.5s ease, z-index 0s 0.8s;
        }

        /* TEXT INSIDE PAPER - Hidden until fully scaled */
        .paper-content { opacity: 0; transition: opacity 1s ease; color: #4a2b32; width: 100%; }
        .paper-greeting { font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: #d16b80; margin-bottom: 20px; }
        .paper-body { font-size: 1.2rem; line-height: 1.8; font-weight: 500; }
        .paper-signoff { display: block; margin-top: 25px; font-weight: 700; font-size: 1.4rem; color: #d16b80; }

        /* === THE MAGIC REVEAL CLASSES === */
        /* 1. Open the flap */
        .mail-wrapper.open .env-flap { transform: rotateX(180deg); z-index: 0; }
        
        /* 2. Pull paper out and scale it up massively */
        .mail-wrapper.extract .paper {
            transform: translateY(-200px) scale(1.3);
            z-index: 10; /* Pops strictly OVER everything */
            height: 350px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        /* 3. Fade in the text ONLY when the paper is big */
        .mail-wrapper.read .paper-content { opacity: 1; }

    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <div id="stage">
        
        <div id="scene-1" class="scene active">
            <h1 class="title">Happy 19th Birthday<br>Bhavika ✨</h1>
            <button class="glass-btn" id="btn-start">Begin the Magic</button>
        </div>

        <div id="scene-2" class="scene">
            <div class="cake">
                <div class="candles" id="btn-blow">
                    <div class="candle"><div class="flame"></div><div class="number">1</div></div>
                    <div class="candle" style="margin-top: -15px;"><div class="flame"></div><div class="number">9</div></div>
                </div>
                <div class="tier tier-1"></div>
                <div class="tier tier-2"></div>
                <div class="tier tier-3"></div>
            </div>
            <div class="hint" id="blow-hint">Make a wish and click the candles! 💨</div>
        </div>

        <div id="scene-3" class="scene">
            <div class="plush-group">
                <svg class="plush" viewBox="0 0 200 200"><circle cx="100" cy="120" r="60" fill="#fff"/><ellipse cx="60" cy="50" rx="15" ry="40" fill="#fff" transform="rotate(-15 60 50)"/><ellipse cx="140" cy="50" rx="15" ry="40" fill="#fff" transform="rotate(15 140 50)"/><circle cx="80" cy="110" r="6" fill="#4a3b32"/><circle cx="120" cy="110" r="6" fill="#4a3b32"/><path d="M 90 125 Q 100 135 110 125" fill="none" stroke="#4a3b32" stroke-width="2"/><ellipse cx="65" cy="120" rx="10" ry="6" fill="#ffb6c1" opacity="0.6"/><ellipse cx="135" cy="120" rx="10" ry="6" fill="#ffb6c1" opacity="0.6"/></svg>
                <svg class="plush center" viewBox="0 0 200 200"><circle cx="100" cy="120" r="70" fill="#d4a373"/><circle cx="50" cy="60" r="25" fill="#d4a373"/><circle cx="150" cy="60" r="25" fill="#d4a373"/><ellipse cx="100" cy="135" rx="30" ry="20" fill="#faedcd"/><circle cx="75" cy="105" r="7" fill="#4a3b32"/><circle cx="125" cy="105" r="7" fill="#4a3b32"/><ellipse cx="100" cy="128" rx="10" ry="6" fill="#4a3b32"/><path d="M 100 134 L 100 145 M 85 140 Q 100 155 115 140" fill="none" stroke="#4a3b32" stroke-width="3"/><ellipse cx="60" cy="125" rx="12" ry="7" fill="#e5989b" opacity="0.7"/><ellipse cx="140" cy="125" rx="12" ry="7" fill="#e5989b" opacity="0.7"/></svg>
                <svg class="plush" viewBox="0 0 200 200"><ellipse cx="100" cy="120" rx="65" ry="55" fill="#f4a261"/><polygon points="40,100 30,40 80,70" fill="#f4a261"/><polygon points="160,100 170,40 120,70" fill="#f4a261"/><ellipse cx="100" cy="135" rx="35" ry="25" fill="#fff"/><circle cx="75" cy="115" r="6" fill="#4a3b32"/><circle cx="125" cy="115" r="6" fill="#4a3b32"/><polygon points="95,128 105,128 100,135" fill="#ffb6c1"/><path d="M 85 140 Q 100 130 115 140" fill="none" stroke="#4a3b32" stroke-width="2"/></svg>
            </div>
        </div>

        <div id="scene-4" class="scene">
            <div class="mail-wrapper" id="mail">
                <div class="env-back"></div>
                <div class="paper">
                    <div class="paper-content">
                        <div class="paper-greeting">My sweetest baby girl,</div>
                        <div class="paper-body">
                            You make my world brighter every single day.<br>
                            May your life always be filled with love, laughter,<br>and magical moments.<br>
                            You are the most precious part of my life.
                        </div>
                        <div class="paper-signoff">Happy 19th Birthday Queen. 👑💖</div>
                    </div>
                </div>
                <div class="env-front-left"></div>
                <div class="env-front-right"></div>
                <div class="env-front"></div>
                <div class="env-flap"></div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. Audio Engine (Web API) ---
        const AudioSys = {
            ctx: null,
            init: function() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playWhoosh: function() {
                if(!this.ctx) return;
                const dur = 1.0; const bufferSize = this.ctx.sampleRate * dur;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.Q.value = 1;
                filter.frequency.setValueAtTime(1200, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + dur);
                const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(1, this.ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            },
            playChime: function() {
                if(!this.ctx) return;
                const notes = [329.63, 440.00, 523.25, 659.25]; // Cheerful arpeggio
                let start = this.ctx.currentTime;
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, start + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.2, start + i * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + i * 0.1 + 0.5);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(start + i * 0.1); osc.stop(start + i * 0.1 + 0.6);
                });
            }
        };

        // --- 2. Canvas Visual Effects ---
        const FX = (function() {
            const canvas = document.getElementById('fx-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];
            let config = { sparkles: true, confetti: false, fireworks: false };

            function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            const rand = (min, max) => Math.random() * (max - min) + min;

            class Particle {
                constructor(type, x, y) {
                    this.type = type; this.x = x || rand(0, w); this.y = y || (type === 'sparkle' ? rand(0,h) : -10);
                    this.colors = ['#f7a8b8', '#ffdfba', '#baffc9', '#bae1ff', '#e8baf5', '#fff'];
                    this.c = this.colors[Math.floor(rand(0, this.colors.length))];
                    
                    if(type === 'sparkle') {
                        this.r = rand(1, 3); this.vy = rand(-0.5, -2); this.a = rand(0.1, 0.8);
                    } else if (type === 'confetti') {
                        this.w = rand(8, 12); this.h = rand(15, 20); this.vy = rand(2, 6); this.vx = rand(-2, 2);
                        this.rot = rand(0,360); this.rotS = rand(-10, 10);
                    } else if (type === 'firework') {
                        this.r = rand(2, 4); this.a = 1;
                        let angle = rand(0, Math.PI*2); let speed = rand(2, 8);
                        this.vx = Math.cos(angle)*speed; this.vy = Math.sin(angle)*speed;
                    }
                }
                update() {
                    if(this.type === 'sparkle') {
                        this.y += this.vy; this.a += rand(-0.05, 0.05);
                        if(this.a < 0) this.a = 0; if(this.a > 1) this.a = 1;
                        if(this.y < 0) this.y = h;
                    } else if (this.type === 'confetti') {
                        this.y += this.vy; this.x += this.vx; this.rot += this.rotS;
                    } else if (this.type === 'firework') {
                        this.vx *= 0.96; this.vy *= 0.96; this.vy += 0.1; // gravity
                        this.x += this.vx; this.y += this.vy; this.a -= 0.02;
                    }
                }
                draw() {
                    ctx.save();
                    if(this.type === 'sparkle') {
                        ctx.fillStyle = `rgba(255,255,255,${this.a})`;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
                    } else if (this.type === 'confetti') {
                        ctx.translate(this.x, this.y); ctx.rotate(this.rot * Math.PI/180);
                        ctx.fillStyle = this.c; ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                    } else if (this.type === 'firework') {
                        ctx.globalAlpha = this.a; ctx.fillStyle = this.c;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // Init Background Sparkles
            for(let i=0; i<40; i++) particles.push(new Particle('sparkle'));

            function loop() {
                ctx.clearRect(0,0,w,h);
                if(config.confetti && Math.random() < 0.1) particles.push(new Particle('confetti'));
                if(config.fireworks && Math.random() < 0.05) {
                    let fx = rand(100, w-100); let fy = rand(100, h/2);
                    for(let i=0; i<40; i++) particles.push(new Particle('firework', fx, fy));
                }

                for(let i = particles.length-1; i >= 0; i--) {
                    let p = particles[i]; p.update(); p.draw();
                    if(p.type !== 'sparkle' && (p.y > h || p.a <= 0)) particles.splice(i, 1);
                }
                requestAnimationFrame(loop);
            }
            loop();

            return {
                burstConfetti: () => { for(let i=0; i<100; i++) particles.push(new Particle('confetti', w/2, h/2)); },
                setMode: (mode, val) => { config[mode] = val; }
            };
        })();

        // --- 3. Scene Timeline Director (Robust Async/Await) ---
        const wait = (ms) => new Promise(res => setTimeout(res, ms));

        async function runCinematicFlow() {
            AudioSys.init();
            const s1 = document.getElementById('scene-1');
            const s2 = document.getElementById('scene-2');
            const s3 = document.getElementById('scene-3');
            const s4 = document.getElementById('scene-4');

            // Move to Cake Scene
            s1.classList.remove('active');
            await wait(1000);
            s2.classList.add('active');

            // Wait for user to blow candle
            const btnBlow = document.getElementById('btn-blow');
            await new Promise(resolve => btnBlow.addEventListener('click', resolve, {once: true}));
            
            // Blow FX
            AudioSys.playWhoosh();
            document.querySelectorAll('.flame').forEach(f => f.classList.add('out'));
            document.getElementById('blow-hint').style.opacity = 0;
            
            await wait(400);
            FX.burstConfetti();
            AudioSys.playChime();
            
            // Transition to Plushies
            await wait(2000);
            s2.classList.remove('active');
            await wait(1000);
            s3.classList.add('active');
            
            // Animate plushies in
            const plushies = document.querySelectorAll('.plush');
            plushies.forEach(p => p.classList.add('show'));
            
            // Transition to Envelope
            await wait(4000); // Let plushies dance
            s3.classList.remove('active');
            await wait(1000);
            s4.classList.add('active');

            // Execute Flawless Envelope Reveal
            const mail = document.getElementById('mail');
            
            await wait(500);
            mail.classList.add('enter'); // Float in
            
            await wait(1200);
            mail.classList.add('open'); // Open Flap
            
            await wait(800);
            mail.classList.add('extract'); // Pull paper out and scale UP over everything
            
            await wait(1500); // Wait for paper to finish growing
            mail.classList.add('read'); // Fade in text on the large paper
            
            // Finale FX
            await wait(1000);
            AudioSys.playChime();
            FX.setMode('fireworks', true);
            FX.setMode('confetti', true);
        }

        // Boot
        document.getElementById('btn-start').addEventListener('click', runCinematicFlow);

    </script>
</body>
</html>
